<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slangify</title><style>
body{margin:0;background:#0b0b13;color:#f4f2ff;font:16px system-ui;padding:22px}main{max-width:850px;margin:auto}.brand{font-weight:800;font-size:22px}.hero{text-align:center;padding:45px 0 20px}.hero h1{font-size:clamp(34px,7vw,56px);line-height:1.05}.hero h1 span{color:#b7a1ff}.muted{color:#aaa6bf}.search{display:flex;gap:8px;margin:25px auto;max-width:650px}.search input{flex:1;min-width:0;background:#171624;color:white;border:1px solid #343047;padding:14px;border-radius:12px}.search button{background:#b7a1ff;border:0;border-radius:12px;padding:0 18px;font-weight:bold}select{background:#171624;color:white;border:1px solid #343047;padding:10px;border-radius:10px;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:15px}.card{background:#171624;border:1px solid #343047;border-radius:15px;padding:17px}.word{font-size:22px;font-weight:bold}.meaning{line-height:1.5}.example{color:#aaa6bf;font-size:13px;border-left:2px solid #7761b9;padding-left:10px}.tag{color:#d4c9ff;background:#29223f;border-radius:30px;padding:4px 8px;font-size:11px;float:right}.footer{color:#aaa6bf;font-size:12px;text-align:center;margin:30px 0}
</style></head><body><main><div class="brand">✦ Slangify <small class="muted">BETA</small></div><section class="hero"><p class="muted">THE INTERNET, DECODED</p><h1>Wait, what does<br><span>that mean?</span></h1><p class="muted">Understand Gen Z & Gen Alpha slang with meanings, context and examples.</p><div class="search"><input id="q" placeholder="Try rizz, cooked, delulu…"><button onclick="render()">Search</button></div><select id="lang" onchange="render()"><option value="en">Meaning in English</option><option value="hi">Meaning in Hindi</option></select><select id="cat" onchange="render()"><option value="all">All categories</option><option>reaction</option><option>people</option><option>internet</option><option>mood</option></select></section><h3 id="heading">Popular slang <small id="count" class="muted"></small></h3><div class="grid" id="out"></div><p class="footer">Prototype dictionary. Slang meanings vary by context and community.</p></main>
<script>
const D=[
["rizz","people","Charm or skill at attracting someone, often through confidence.","किसी को आकर्षित करने का अंदाज़ या charm, अक्सर confidence के साथ।","He has so much rizz."],
["delulu","mood","Playfully believing something unrealistic will happen.","मज़ाक में ऐसी उम्मीद रखना जो शायद हकीकत से दूर हो।","I'm delulu enough to think I'll win."],
["cooked","reaction","In trouble, exhausted, or facing a bad outcome; context matters.","मुसीबत में होना, थक जाना या बुरा हाल होना; context ज़रूरी है।","I forgot the exam. I'm cooked."],
["no cap","internet","I'm being honest; this isn't a lie.","मैं सच बोल रहा हूँ; झूठ नहीं है।","That was the best movie, no cap."],
["fr","internet","Short for 'for real'; emphasizes truth or agreement.","'For real' का छोटा रूप; सहमति या बात पर ज़ोर।","That test was hard fr."],
["pmo","reaction","Usually 'pisses me off' (annoys me); sometimes 'put me on' (recommend it).","अक्सर 'बहुत irritate करता है'; कभी 'मुझे recommend करो' भी।","This noise pmo."],
["ate","reaction","Did something extremely well; nailed it.","किसी काम को शानदार तरीके से करना।","She ate that performance."],
["mid","reaction","Mediocre or average; not impressive.","औसत या खास अच्छा नहीं।","The sequel was mid."],
["it's giving","mood","Describes the vibe or impression something has.","किसी चीज़ का vibe या impression बताना।","It's giving main character."],
["sus","people","Suspicious or seeming dishonest.","शक़ी या गड़बड़ लगना।","That excuse is sus."],
["slay","reaction","Do something impressively or look amazing.","कमाल करना या शानदार दिखना।","You slayed that outfit."],
["lowkey","mood","Somewhat, secretly, or without making a big deal.","थोड़ा, चुपचाप, या बिना दिखावा किए।","I lowkey want pizza."],
["highkey","mood","Very openly, strongly, or definitely.","खुले तौर पर या बहुत ज़्यादा।","I highkey love this song."],
["touch grass","internet","Jokingly: log off and spend time in real life.","मज़ाक में: online से बाहर आकर real life में समय बिताओ।","You've argued for hours. Touch grass."],
["brainrot","internet","Silly or repetitive internet content that occupies your thoughts.","ऐसा silly या repetitive internet content जो दिमाग़ में छाया रहे।","That meme is pure brainrot."],
["GOAT","people","Greatest of all time; the best ever.","अब तक का सबसे महान।","Messi is the GOAT."],
["bet","reaction","Okay, agreed, or sounds good.","ठीक है, मंज़ूर, या ऐसा ही करते हैं।","Meet at six? Bet."],
["NPC","people","Joking label for someone acting predictable; can be insulting.","बहुत predictable व्यक्ति के लिए मज़ाक; insult भी हो सकता है।","Bro walks like an NPC."],
["W / L","reaction","W means a win/good thing; L means a loss/bad thing.","W मतलब जीत/अच्छी बात; L मतलब हार/बुरी बात।","W decision."],
["aura","people","A person's perceived vibe, confidence, or coolness.","किसी का vibe, confidence या coolness।","That entrance gave +1000 aura."]
];
function render(){let q=document.getElementById('q').value.toLowerCase().trim(),c=document.getElementById('cat').value,l=document.getElementById('lang').value;let a=D.filter(x=>(c==='all'||x[1]===c)&&(x[0].includes(q)||x[2].toLowerCase().includes(q)||x[3].includes(q)));document.getElementById('heading').childNodes[0].textContent=q?'Search results ':'Popular slang ';document.getElementById('count').textContent='('+a.length+')';document.getElementById('out').innerHTML=a.length?a.map(x=>`<article class="card"><span class="tag">${x[1]}</span><div class="word">${x[0]}</div><p class="meaning">${l==='hi'?x[3]:x[2]}</p><div class="example">“${x[4]}”</div></article>`).join(''):'<p class="muted">No match. Try another word.</p>'}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')render()});render();
</script></body></html>
